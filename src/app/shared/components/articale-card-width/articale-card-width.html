@for (a of getdata; track $index) {
    <article
    class="group relative bg-[#161616] rounded-3xl overflow-hidden border border-[#262626] hover:border-orange-500/30 transition-all duration-500 mb-8"
    [style.animation-delay]="($index * 100) + 'ms'">


    <a class="block" [routerLink]="['/blog', a.slug]">

      <div class="grid md:grid-cols-2 gap-0">

        <!-- Image -->
        <div class="relative h-72 md:h-[400px] overflow-hidden">

          <img [src]="a.img" [alt]="a.title"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out">

          <div
            class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500">
          </div>

          <div class="absolute top-4 right-4">

            <span
              class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-gradient-to-r from-orange-500 to-yellow-500 text-white text-xs font-semibold rounded-full">
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                <path
                  d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z">
                </path>
              </svg>

              مميز
            </span>

          </div>

        </div>

        <!-- Content -->
        <div class="p-8 md:p-10 flex flex-col justify-center bg-[#161616]">

          <div class="flex items-center gap-3 mb-4">

            <span
              class="px-3 py-1 bg-orange-500/10 text-orange-500 text-xs font-semibold rounded-full border border-orange-500/20">
              {{ a.span_desc }}
            </span>

            <span class="flex items-center gap-1 text-sm text-neutral-500">
              <i class="fa-regular fa-clock"></i>
              {{ a.time }}
            </span>

          </div>

          <h2
            class="text-2xl md:text-3xl font-bold text-white mb-4 group-hover:text-orange-500 transition-colors duration-300 leading-tight">
            {{ a.title }}
          </h2>

          <p class="text-neutral-400 mb-6 line-clamp-3 leading-relaxed">
            {{ a.description }}
          </p>

          <div class="flex items-center justify-between mt-auto">

            <!-- Author -->
            <div class="flex items-center gap-3">

              <div class="relative">

                <img [src]="a.writer_img" [alt]="a.name"
                  class="w-12 h-12 rounded-full object-cover ring-2 ring-[#262626] shadow-md">

                <div class="absolute -bottom-1 -left-1 w-4 h-4 bg-orange-500 rounded-full border-2 border-[#161616]">
                </div>

              </div>

              <div>

                <p class="text-sm font-semibold text-white">
                  {{ a.name }}
                </p>

                <p class="text-xs text-neutral-500">
                  {{ a.job }}
                </p>

                <p class="text-xs text-neutral-500">
                  {{ a.date }}
                </p>

              </div>

            </div>

            <!-- Read Article -->
            <span
              class="inline-flex items-center gap-2 text-orange-500 font-semibold text-sm group-hover:gap-3 transition-all duration-300">
              اقرأ المقال

              <svg class="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3">
                </path>
              </svg>

            </span>

          </div>

        </div>

      </div>

    </a>

  </article>
}
