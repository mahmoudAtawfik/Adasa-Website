<div class="mt-6 p-8 bg-gradient-to-br from-[#161616] to-[#111111] rounded-2xl border border-[#262626]">
  <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6"><img [alt]="name"
      class="w-24 h-24 rounded-2xl object-cover ring-4 ring-orange-500/20"
      [src]="path">
    <div class="text-center sm:text-right flex-1"><span
        class="text-xs text-orange-500 font-semibold uppercase tracking-wider">كاتب المقال</span>
      <h3 class="text-xl font-bold text-white mt-1">{{name}}</h3>
      <p class="text-neutral-500 text-sm mb-3">{{wotk}}</p>
      <p class="text-neutral-400 text-sm leading-relaxed">مصور محترف شغوف بمشاركة المعرفة والخبرات في عالم التصوير
        الفوتوغرافي.</p>
    </div>
  </div>
</div>
