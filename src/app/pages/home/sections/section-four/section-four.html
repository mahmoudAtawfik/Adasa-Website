<section class="py-24 bg-[#0a0a0a] relative overflow-hidden">
  <div class="absolute bottom-0 left-0 w-1/3 h-full bg-gradient-to-r from-orange-500/5 to-transparent"></div>
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-4">
      <div>
        <app-section-label>
          <div class="flex items-center gap-1.5">
            <span class="relative flex h-2 w-2">
              <span
                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-500 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
            </span>
          </div>
          <span class="text-sm font-medium text-neutral-300">
            الاحدث
          </span>
        </app-section-label>
        <app-section-title>أحدث المقالات</app-section-title>
        <app-section-subtitle>محتوى جديد طازج من المطبعة</app-section-subtitle>
      </div>
      <a routerLink="/blog"
        class="group inline-flex items-center gap-2 text-orange-500 font-semibold hover:text-orange-400 transition-colors">
        عرض جميع المقالات

        <i class="fa-solid fa-arrow-left w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
      </a>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (d of data.data.slice(0, 3); track d.slug) {
      <article class="group card overflow-hidden" style="animation-delay: 200ms;">
        <a class="block">

          <div class="relative h-52 overflow-hidden">
            <img [alt]="d.title"
              class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out"
              [src]="d.img">

            <div
              class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500">
            </div>

            <div class="absolute top-4 right-4">
              <span
                class="px-3 py-1 bg-[#0a0a0a]/80 backdrop-blur-sm text-white text-xs font-semibold rounded-full border border-[#333333]">
                {{ d.span_desc }}
              </span>
            </div>
          </div>

          <div class="p-6">

            <div class="flex items-center gap-3 text-sm text-neutral-500 mb-3">

              <span class="flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z">
                  </path>
                </svg>

                {{ d.time }}
              </span>

              <span class="w-1 h-1 bg-neutral-600 rounded-full"></span>

              <span>{{ d.date }}</span>

            </div>

            <h3
              class="text-xl font-bold text-white mb-3 group-hover:text-orange-500 transition-colors duration-300 line-clamp-2 leading-tight">
              {{ d.title }}
            </h3>

            <p class="text-neutral-400 mb-5 line-clamp-2 text-sm leading-relaxed">
              {{ d.description }}
            </p>

            <div class="flex items-center justify-between pt-4 border-t border-[#262626]">

              <div class="flex items-center gap-3">

                <img [alt]="d.name" class="w-9 h-9 rounded-full object-cover ring-2 ring-[#262626]"
                  [src]="d.writer_img">

                <div>
                  <p class="text-sm font-medium text-white">
                    {{ d.name }}
                  </p>

                  <p class="text-xs text-neutral-500">
                    {{ d.job }}
                  </p>
                </div>

              </div>

              <div
                class="w-8 h-8 rounded-full bg-orange-500/10 flex items-center justify-center group-hover:bg-orange-500 transition-colors duration-300 border border-orange-500/20 group-hover:border-transparent">

                <svg class="w-4 h-4 text-orange-500 group-hover:text-white transition-colors duration-300 rotate-180"
                  fill="none" stroke="currentColor" viewBox="0 0 24 24">

                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7">
                  </path>

                </svg>

              </div>

            </div>

          </div>

        </a>
      </article>

      }
    </div>

  </div>
</section>
